services:
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    expose:
      - "80"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./backend
    expose:
      - "8000"
    environment:
      PORT: 8000
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://orbit:${POSTGRES_PASSWORD:-orbit-demo-password}@db:5432/orbitdesk
      JWT_SECRET: ${JWT_SECRET:-portfolio-demo-jwt-secret-change-in-real-deployments-2026}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s

  db:
    image: postgres:17-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: orbitdesk
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit-demo-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbitdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  upload-data:

