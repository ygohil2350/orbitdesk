server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Used for direct local Compose access. Portfolio Launcher routes /api to api itself.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Intentionally no X-Frame-Options/frame-ancestors: the launcher embeds this UI.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
